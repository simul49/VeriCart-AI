server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:vericart}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:paradox49}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.vericart.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:YOUR_JWT_SECRET_CHANGE_ME}
  expiration: 86400000

# AI Provider Configuration
# API keys MUST be set via environment variables in production.
# Copy .env.example to .env and fill in your actual keys for local development.
ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:YOUR_DEEPSEEK_API_KEY}
    alt-api-key: ${DEEPSEEK_ALT_API_KEY:YOUR_DEEPSEEK_ALT_API_KEY}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: deepseek-chat
  qwen:
    api-key: ${QWEN_API_KEY:YOUR_QWEN_API_KEY}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus
  hunyuan:
    api-key: ${HUNYUAN_API_KEY:YOUR_HUNYUAN_API_KEY}
    base-url: https://api.hunyuan.cloud.tencent.com/v1
    model: hunyuan-lite
