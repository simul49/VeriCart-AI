version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: vericart-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_DATABASE: ${DB_NAME:-vericart}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vericart-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-vericart}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      # All three providers are served by Tencent Cloud TokenHub (international).
      # A single TokenHub key works for kimi-k3, hy4-preview, deepseek-v4-pro-0813.
      AI_MOCK_ENABLED: ${AI_MOCK_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-YOUR_DEEPSEEK_API_KEY}
      DEEPSEEK_ALT_API_KEY: ${DEEPSEEK_ALT_API_KEY:-YOUR_DEEPSEEK_ALT_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://tokenhub-intl.tencentcloudmaas.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro-0813}
      KIMI_API_KEY: ${KIMI_API_KEY:-YOUR_KIMI_API_KEY}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://tokenhub-intl.tencentcloudmaas.com/v1}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-k3}
      HUNYUAN_API_KEY: ${HUNYUAN_API_KEY:-YOUR_HUNYUAN_API_KEY}
      HUNYUAN_BASE_URL: ${HUNYUAN_BASE_URL:-https://tokenhub-intl.tencentcloudmaas.com/v1}
      HUNYUAN_MODEL: ${HUNYUAN_MODEL:-hy4-preview}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vericart-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
